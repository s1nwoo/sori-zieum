version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: sorizieum-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sorizieum
      POSTGRES_USER: sorizieum
      POSTGRES_PASSWORD: sorizieum
    volumes:
      - sorizieum_pgdata:/var/lib/postgresql/data

volumes:
  sorizieum_pgdata:
